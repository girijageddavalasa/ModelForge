<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ModelForge Local{% endblock %}</title>
    {{ bootstrap.load_css() }}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="{{ url_for('main.home') }}">ModelForge Local</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('main.home') }}">Dashboard</a>
                <a class="nav-link" href="{{ url_for('projects.index') }}">Projects</a>
            </div>
        </div>
    </nav>
    <main class="container py-5">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
    {{ bootstrap.load_js() }}
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
