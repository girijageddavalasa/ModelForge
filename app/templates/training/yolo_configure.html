{% extends "base.html" %}
{% block title %}Train YOLO · {{ dataset.name }}{% endblock %}
{% block content %}
<div class="mb-4"><a href="{{ url_for('annotations.gallery', dataset_id=dataset.id) }}" class="text-decoration-none">Image gallery</a><h1 class="h2 mt-2">Train YOLO</h1><p class="text-secondary">Accepted annotations become a deterministic YOLO train/validation dataset. Training runs in a local background process.</p></div>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="card shadow-sm mb-4"><div class="card-body"><div class="row g-3">
<div class="col-md-6"><label class="form-label" for="base_model">Base model</label><select class="form-select" id="base_model" name="base_model">{% for name in base_models %}<option value="{{ name }}" {% if request.form.get('base_model', 'yolo11n.pt') == name %}selected{% endif %}>{{ name }}</option>{% endfor %}</select></div>
<div class="col-md-3"><label class="form-label" for="epochs">Epochs</label><input class="form-control" type="number" min="1" max="1000" id="epochs" name="epochs" value="{{ request.form.get('epochs', '20') }}"></div>
<div class="col-md-3"><label class="form-label" for="image_size">Image size</label><select class="form-select" id="image_size" name="image_size">{% for size in [320,416,512,640,768,1024,1280] %}<option value="{{ size }}" {% if request.form.get('image_size', '640')|int == size %}selected{% endif %}>{{ size }}</option>{% endfor %}</select></div>
<div class="col-md-3"><label class="form-label" for="batch_size">Batch size</label><input class="form-control" type="number" min="1" max="256" id="batch_size" name="batch_size" value="{{ request.form.get('batch_size', '8') }}"></div>
<div class="col-md-3"><label class="form-label" for="confidence">Confidence</label><input class="form-control" type="number" min="0.01" max="0.99" step="0.01" id="confidence" name="confidence" value="{{ request.form.get('confidence', '0.25') }}"></div>
<div class="col-md-3"><label class="form-label" for="validation_fraction">Validation fraction</label><input class="form-control" type="number" min="0.1" max="0.4" step="0.05" id="validation_fraction" name="validation_fraction" value="{{ request.form.get('validation_fraction', '0.2') }}"></div>
<div class="col-md-3"><label class="form-label" for="random_seed">Random seed</label><input class="form-control" type="number" id="random_seed" name="random_seed" value="{{ request.form.get('random_seed', '42') }}"></div>
<div class="col-md-4"><label class="form-label" for="device">Device</label><select class="form-select" id="device" name="device"><option value="auto">Auto-detect</option><option value="cpu">CPU</option><option value="0">CUDA GPU 0</option></select></div>
</div></div></div><button class="btn btn-primary" type="submit">Queue YOLO training</button></form>
{% endblock %}
